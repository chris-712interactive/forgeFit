<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Dichotic — Per-ear frequency player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand-block">
        <p class="brand">Dichotic</p>
        <h1 class="headline">Two ears. Two frequencies.</h1>
        <p class="lede">
          Independent oscillators for left and right channels. Headphones required.
        </p>
      </header>

      <section class="stage" aria-label="Playback">
        <div class="ears" aria-hidden="true">
          <div class="ear ear-left" data-ear="left">
            <span class="ear-label">L</span>
            <span class="ear-hz" id="leftReadout">220</span>
            <span class="ear-unit">Hz</span>
          </div>
          <div class="delta-pill">
            <span class="delta-label">Δ</span>
            <span class="delta-value" id="deltaReadout">20</span>
            <span class="delta-unit">Hz</span>
          </div>
          <div class="ear ear-right" data-ear="right">
            <span class="ear-label">R</span>
            <span class="ear-hz" id="rightReadout">240</span>
            <span class="ear-unit">Hz</span>
          </div>
        </div>

        <canvas id="waveCanvas" class="wave" width="720" height="120" aria-hidden="true"></canvas>

        <div class="transport">
          <button type="button" id="playBtn" class="play-btn" aria-pressed="false">
            <span class="play-icon" aria-hidden="true"></span>
            <span class="play-text">Play</span>
          </button>
          <label class="master-vol">
            <span>Volume</span>
            <input id="masterVol" type="range" min="0" max="100" value="18" />
          </label>
        </div>
      </section>

      <section class="controls" aria-label="Frequency controls">
        <div class="channel channel-left">
          <div class="channel-head">
            <h2>Left ear</h2>
            <button type="button" class="mute-btn" data-mute="left" aria-pressed="false">Mute</button>
          </div>
          <label class="freq-field">
            <span class="sr-only">Left frequency</span>
            <input id="leftHz" type="range" min="20" max="1500" step="1" value="220" />
            <input id="leftHzNum" type="number" min="20" max="1500" step="1" value="220" />
          </label>
        </div>

        <div class="channel channel-right">
          <div class="channel-head">
            <h2>Right ear</h2>
            <button type="button" class="mute-btn" data-mute="right" aria-pressed="false">Mute</button>
          </div>
          <label class="freq-field">
            <span class="sr-only">Right frequency</span>
            <input id="rightHz" type="range" min="20" max="1500" step="1" value="240" />
            <input id="rightHzNum" type="number" min="20" max="1500" step="1" value="240" />
          </label>
        </div>
      </section>

      <section class="options" aria-label="Waveform and presets">
        <label class="wave-select">
          <span>Waveform</span>
          <select id="waveform">
            <option value="sine" selected>Sine</option>
            <option value="triangle">Triangle</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
          </select>
        </label>

        <div class="presets" role="group" aria-label="Presets">
          <button type="button" data-preset="unison">Unison 200</button>
          <button type="button" data-preset="binaural4">Binaural Δ4</button>
          <button type="button" data-preset="binaural10">Binaural Δ10</button>
          <button type="button" data-preset="wide">Wide dichotic</button>
        </div>
      </section>

      <p class="footnote">
        Prototype only — not a medical device. Keep volume low. Use stereo headphones.
      </p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
